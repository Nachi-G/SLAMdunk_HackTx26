<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLAMdunk live map</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;color:#e2e8f0;font:14px system-ui}canvas{width:100%;height:100%;display:block;touch-action:none}header{position:absolute;top:18px;left:20px;padding:16px;background:#111c30ed;border:1px solid #334155;border-radius:12px;max-width:380px}h1{font-size:20px;margin:0 0 8px}p{margin:7px 0;color:#b8c6dc}#connection{color:#fbbf24}button{color:#e2e8f0;background:#253653;border:1px solid #52637e;border-radius:6px;padding:7px 12px;cursor:pointer}small{display:block;margin-top:10px;color:#94a3b8}#warning{color:#fbbf24}
</style>
<canvas id="view" aria-label="Interactive live three dimensional point cloud"></canvas>
<header><h1>SLAMdunk · live geometric map</h1><div id="connection">Connecting…</div><p id="details">Waiting for map and drone pose.</p><p id="warning"></p><button id="fit">Fit map</button> <button id="clear">Clear pose trail</button><small>Drag to orbit · scroll to zoom · Z is up<br>Points: measured occupancy · cyan: drone · orange: pose history</small></header>
<script>
'use strict';
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');
const connection=document.getElementById('connection'),details=document.getElementById('details'),warning=document.getElementById('warning');
let points=[],pose=null,trail=[],frame=null,revision=0,mode='map_snapshot',lastMap=0,lastPose=0,status=null,socket;
let azimuth=.75,elevation=.65,distance=16,center=[0,0,1],drag=null,dirty=true;
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;dirty=true}addEventListener('resize',resize);resize();
function fit(){if(!points.length)return;let lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(const p of points)for(let j=0;j<3;j++){lo[j]=Math.min(lo[j],p[j]);hi[j]=Math.max(hi[j],p[j])}center=lo.map((v,i)=>(v+hi[i])/2);distance=Math.max(3,Math.hypot(...lo.map((v,i)=>hi[i]-v))*1.4);dirty=true}
document.getElementById('fit').onclick=fit;document.getElementById('clear').onclick=()=>{trail=[];dirty=true};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!drag)return;azimuth-=(e.clientX-drag[0])*.008;elevation=Math.max(.05,Math.min(1.5,elevation+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];dirty=true};
canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();distance=Math.max(.5,Math.min(10000,distance*Math.exp(e.deltaY*.001)));dirty=true};
function project(p){let x=p[0]-center[0],y=p[1]-center[1],z=p[2]-center[2],ca=Math.cos(azimuth),sa=Math.sin(azimuth),ce=Math.cos(elevation),se=Math.sin(elevation);let sx=-sa*x+ca*y,sy=-se*(ca*x+sa*y)+ce*z,depth=distance-ce*(ca*x+sa*y)-se*z;if(depth<.05)return null;let scale=Math.min(canvas.width,canvas.height)*.9/depth;return [canvas.width/2+sx*scale,canvas.height/2-sy*scale,scale]}
function line(a,b,color,width=1){const p=project(a),q=project(b);if(!p||!q)return;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.strokeStyle=color;ctx.lineWidth=width*devicePixelRatio;ctx.stroke()}
function draw(){requestAnimationFrame(draw);if(!dirty)return;dirty=false;ctx.fillStyle='#0b1220';ctx.fillRect(0,0,canvas.width,canvas.height);for(let i=-10;i<=10;i++){line([i,-10,0],[i,10,0],'#172337');line([-10,i,0],[10,i,0],'#172337')}line([0,0,0],[2,0,0],'#ef4444',2);line([0,0,0],[0,2,0],'#22c55e',2);line([0,0,0],[0,0,2],'#3b82f6',2);
for(const p of points){const q=project(p);if(!q)continue;ctx.fillStyle=`hsl(${210-Math.max(0,Math.min(4,p[2]))*28} 65% 65%)`;const size=Math.max(1.5,Math.min(5,q[2]*.035))*devicePixelRatio;ctx.fillRect(q[0],q[1],size,size)}
for(let i=1;i<trail.length;i++)line(trail[i-1],trail[i],'#fb923c',2);
if(pose){const p=project(pose.position);if(p){ctx.fillStyle='#22d3ee';ctx.beginPath();ctx.arc(p[0],p[1],7*devicePixelRatio,0,2*Math.PI);ctx.fill();const [x,y,z,w]=pose.orientation,forward=[1-2*(y*y+z*z),2*(x*y+w*z),2*(x*z-w*y)];line(pose.position,pose.position.map((v,i)=>v+forward[i]*.7),'#67e8f9',3)}}}
function connect(){socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/stream`);socket.onopen=()=>{points=[];pose=null;trail=[];frame=null;revision=0;mode="map_snapshot";status=null;lastMap=0;lastPose=0;dirty=true;connection.textContent='Connected · waiting for ROS updates';connection.style.color='#34d399'};socket.onclose=()=>{connection.textContent='Disconnected · reconnecting';connection.style.color='#fbbf24';setTimeout(connect,1500)};socket.onerror=()=>socket.close();socket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.protocol_version!==1)return;if(m.type==='status'){status=m;mode=m.mode;return}if(!['map','pose'].includes(m.type))return;if(frame&&frame!==m.frame_id){warning.textContent='Frame mismatch: update ignored';return}frame=m.frame_id;if(m.type==='map'&&m.operation==='replace'){const first=points.length===0;points=m.points;revision=m.revision;lastMap=performance.now();if(first)fit()}if(m.type==='pose'){pose=m;lastPose=performance.now();trail.push(m.position);if(trail.length>500)trail.shift()}dirty=true}catch(error){warning.textContent='Invalid stream message'}}}
setInterval(()=>{const now=performance.now();details.textContent=`${points.length.toLocaleString()} points · frame ${frame||'—'} · revision ${revision}`;if(socket?.readyState===WebSocket.OPEN){connection.textContent=mode==='synthetic_demo'?'Connected · SYNTHETIC DEMO':'Connected · live ROS map'}const stale=[];if(!lastMap||now-lastMap>3000)stale.push('map');if(!lastPose||now-lastPose>3000)stale.push('pose');if(status?.age_seconds)for(const name of ['map','pose'])if(status.age_seconds[name]===null||status.age_seconds[name]>3){if(!stale.includes(name))stale.push(name)}warning.textContent=stale.length?`Waiting / stale: ${stale.join(', ')}. Existing geometry remains visible.`:''},500);
draw();connect();
</script></html>
