# Overrides applied to the copied planner's complete upstream configuration.
sando_node:
  ros__parameters:
    use_sim_time: true
    sim_env: gazebo
    use_hardware: false
    vehicle_type: ground_robot
    use_state_update: true
    use_global_pc: false
    force_goal_z: true
    default_goal_z: 0.3
    z_min: 0.0
    z_max: 1.0
    x_min: -12.0
    x_max: 12.0
    y_min: -9.0
    y_max: 9.0
    sando_map_res: 0.2
    v_max: 0.25
    a_max: 0.4
    j_max: 1.0
    w_max: 0.6
    w_max_yawing: 0.6
    drone_bbox: [0.74, 0.74, 0.68]
    inflation_hgp: 0.42
    environment_assumption: static
    sfc_size: [2.0, 2.0, 1.0]
    horizon: 4.0
    goal_radius: 0.3
    goal_seen_radius: 0.6
    hover_avoidance_enabled: false
    use_free_start: false
    use_free_goal: false
    visual_level: 1
