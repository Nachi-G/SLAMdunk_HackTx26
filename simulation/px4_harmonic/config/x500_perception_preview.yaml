# Read-only simulation data bridges. No SANDO or PX4 command inputs.
- ros_topic_name: /sando_perception/lidar/points_raw
  gz_topic_name: /sando/lidar/scan/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  lazy: false
  publisher_queue: 5
- ros_topic_name: /sando_perception/gazebo/poses
  gz_topic_name: /world/default/pose/info
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
  lazy: false
- ros_topic_name: /sando_perception/gazebo/clock
  gz_topic_name: /world/default/clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
  lazy: false
